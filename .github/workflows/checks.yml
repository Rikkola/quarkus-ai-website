name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Run unit tests
        run: bundle exec rake test

  html-proofer:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Fetch upstream snippets
        run: bundle exec rake snippets:fetch
      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: html-proofer (internal links)
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/localhost/" \
            --allow-missing-href \
            --swap-urls "^/quarkus-ai-website/:/"

  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Fetch upstream snippets
        run: bundle exec rake snippets:fetch
      - name: Build site
        run: bundle exec jekyll build
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install serve + Lighthouse CI
        run: npm install -g serve @lhci/cli
      - name: Run Lighthouse CI
        run: |
          serve _site -p 3000 &
          sleep 3
          lhci autorun \
            --collect.url=http://localhost:3000 \
            --upload.target=temporary-public-storage
